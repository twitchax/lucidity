on: [push]

name: Build and Test

# `lunatic-rs` is a path dependency on a sibling checkout (and the e2e tests run on a sibling `lunatic`), so every job
# lays the repos out side by side.

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lucidity
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic-rs
          ref: main
          path: lunatic-rs
      - name: Install toolchain
        working-directory: lucidity
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lucidity
      - name: Build
        working-directory: lucidity
        run: cargo build --target wasm32-wasip1 --lib --examples --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lucidity
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic-rs
          ref: main
          path: lunatic-rs
      - name: Install toolchain
        working-directory: lucidity
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lucidity
      - name: Test
        working-directory: lucidity
        run: cargo test -p lucidity-macros

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lucidity
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic-rs
          ref: main
          path: lunatic-rs
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic
          ref: main
          path: lunatic
      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal
          (cd lucidity && rustup toolchain install)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lunatic
            lucidity
      - name: Build the runtime
        working-directory: lunatic
        run: cargo +stable build --release
      - name: Test
        working-directory: lucidity
        run: cargo test -p lucidity-e2e
      # Guest tests run on the runtime built above, through the cargo runner.
      - name: Test fly
        working-directory: lucidity
        run: cargo test --target wasm32-wasip1 -p lucidity --features fly --lib
