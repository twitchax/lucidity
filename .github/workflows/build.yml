on: [push]

name: Build and Test

# `lunatic-rs` is a path dependency on a sibling checkout (and the e2e tests run on a sibling `lunatic`), so every job
# lays the repos out side by side.
# TODO: Move the `lunatic-rs` and `lunatic` refs to `main` once the `upgrade` branches land there.

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lucidity
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic-rs
          ref: upgrade
          path: lunatic-rs
      - name: Install toolchain
        working-directory: lucidity
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lucidity
      - name: Build
        working-directory: lucidity
        # The `fly` feature is left out: `nightfly` pulls in `stdweb`, which no longer compiles.
        run: cargo build --target wasm32-wasip1 --lib --examples

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lucidity
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic-rs
          ref: upgrade
          path: lunatic-rs
      - name: Install toolchain
        working-directory: lucidity
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lucidity
      - name: Test
        working-directory: lucidity
        run: cargo test -p lucidity-macros

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lucidity
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic-rs
          ref: upgrade
          path: lunatic-rs
      - uses: actions/checkout@v4
        with:
          repository: twitchax/lunatic
          ref: upgrade
          path: lunatic
      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal
          (cd lucidity && rustup toolchain install)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lunatic
            lucidity
      - name: Build the runtime
        working-directory: lunatic
        run: cargo +stable build --release
      - name: Test
        working-directory: lucidity
        run: cargo test -p lucidity-e2e
