[workspace]
members = ["lucidity-core", "lucidity-macros", "lucidity", "lucidity-e2e"]
resolver = "2"

# `lunatic-rs` and `lunatic` (the runtime) are developed as forks checked out next to this repo.
[workspace.dependencies]
lunatic = { package = "lunatic-twitchax-patch", version = "0.15.0", path = "../lunatic-rs" }
serde = "1.0.229"
