[package]
name = "lucidity-core"
version = "0.2.0"
edition = "2021"
authors = ["Aaron Roney <twitchax@gmail.com>"]
license = "MIT"
description = "A distributed orchestrator platform for Rust."
readme = "../README.md"
repository = "https://github.com/twitchax/lucidity"
keywords = ["lucidity", "orchestrator", "distributed", "macro"]
categories = ["orchestration"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lunatic = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rand = "0.10.3"