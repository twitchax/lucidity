[package]
name = "lucidity-macros"
version = "0.2.2"
edition = "2021"
authors = ["Aaron Roney <twitchax@gmail.com>"]
license = "MIT"
description = "A distributed orchestrator platform for Rust."
readme = "../README.md"
repository = "https://github.com/twitchax/lucidity"
keywords = ["lucidity", "orchestrator", "distributed", "macro"]
categories = ["concurrency", "wasm"]

[lib]
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proc-macro2 = "1.0.107"
syn = { version = "3.0.9", features = ["full"] }
quote = "1.0.47"
convert_case = "0.12.0"